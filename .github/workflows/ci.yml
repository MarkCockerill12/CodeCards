name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Needed by scripts/verify-code.mjs to execute the Python `predict-output` cards.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      # Schema-validate every card and pre-highlight its code with Shiki.
      - run: npm run content

      # Execute every card that documents its own output and assert it still matches.
      # This is what stops the content library rotting.
      - run: npm run verify

      - run: npm run lint
      - run: npm run typecheck
      - run: npx next build

  links:
    # Network-bound and slow: nightly, and never blocking a pull request.
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run links
